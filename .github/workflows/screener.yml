# Save this file at: .github/workflows/screener.yml  in your GitHub repo
name: Stock Screener

on:
  schedule:
    # setiap 20 menit, 08:00-15:40 WIB (01:00-08:40 UTC), Senin-Jumat
    - cron: "*/20 1-8 * * 1-5"
    # tambahan 1 run tepat jam 16:00 WIB (09:00 UTC), Senin-Jumat
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: python screener.py
